# UnboxEd marketing site: unboxlearning.in
# Install:  sudo cp nginx-unboxlearning.conf /etc/nginx/sites-available/unboxlearning
#           sudo ln -s /etc/nginx/sites-available/unboxlearning /etc/nginx/sites-enabled/
#           sudo nginx -t && sudo systemctl reload nginx
#           sudo certbot --nginx -d unboxlearning.in -d www.unboxlearning.in   (adds HTTPS + redirect)

server {
    listen 80;
    listen [::]:80;
    server_name unboxlearning.in www.unboxlearning.in;

    root /var/www/unboxlearning/current;
    index index.html;

    # every page is a folder with an index.html, so /how-it-works/ just works
    location / {
        try_files $uri $uri/ =404;
    }
    error_page 404 /404.html;

    # old page addresses from the first version of the site
    location = /features/            { return 301 /experience/; }
    location = /plans/               { return 302 /contact/?topic=early-access; }
    location = /solutions/           { return 301 /organizations/; }
    location = /solutions/schools/   { return 301 /organizations/#schools; }
    location = /solutions/companies/ { return 301 /organizations/#companies; }
    location = /solutions/publishers/ { return 301 /educators/; }
    location = /solutions/exam-prep/ { return 301 /learners/; }

    # CSS and JS links carry a content fingerprint (?v=...), so they can be cached for a long time
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
    }
    location ~* \.html$ { add_header Cache-Control "no-cache"; }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/xml text/plain;
}
