<section class="sec" id="try">
  <div class="wrap two-col">
    <div class="head">
      <p class="eyebrow c">Try the engine</p>
      <h2>Give us something <span class="hl-c">boring.</span></h2>
      <p class="lede">A textbook page. A policy document. A lecture. A training deck.</p>
      <p class="lede"><b>We'll show you what it could become.</b></p>
    </div>
    <div class="try-box">
      <label class="drop" for="try-file" id="try-drop">
        <b>Drop a file here</b>
        <span>PDF · PPT · DOC · URL</span>
        <input id="try-file" type="file" accept=".pdf,.ppt,.pptx,.doc,.docx,.txt,.md,.epub,.xlsx,.csv">
      </label>
      <div class="try-row">
        <input id="try-url" type="url" placeholder="…or paste a link" aria-label="Link to a page or video">
        <button class="btn btn-primary btn-sm" type="button" id="try-go">Unbox it →</button>
      </div>
      <button class="link-btn" type="button" id="try-example">or try an example</button>
      <div class="try-result" id="try-result" aria-live="polite" hidden></div>
    </div>
  </div>
</section>
