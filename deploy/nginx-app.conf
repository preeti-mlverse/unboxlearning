# UnboxEd product app: app.unboxlearning.in (copy and change server_name/ports for staging.unboxlearning.in)
# Install:  sudo cp nginx-app.conf /etc/nginx/sites-available/unboxed-app
#           sudo ln -s /etc/nginx/sites-available/unboxed-app /etc/nginx/sites-enabled/
#           sudo nginx -t && sudo systemctl reload nginx
#           sudo certbot --nginx -d app.unboxlearning.in
#
# /api/* goes straight to the FastAPI service (uvicorn on 127.0.0.1:8040, prefix stripped);
# everything else goes to the Next.js server (127.0.0.1:3010). One origin, so session cookies stay first-party.

server {
    listen 80;
    listen [::]:80;
    server_name app.unboxlearning.in;

    client_max_body_size 55m;   # uploads are capped at 50 MB by the API

    location /api/ {
        proxy_pass http://127.0.0.1:8040/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
}
