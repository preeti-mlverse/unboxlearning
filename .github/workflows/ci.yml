name: ci

on:
  push: { branches: [main] }
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_USER: unboxed, POSTGRES_PASSWORD: unboxed_dev, POSTGRES_DB: unboxed_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U unboxed" --health-interval 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://unboxed:unboxed_dev@localhost:5432/unboxed_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: apps/api/requirements*.txt }
      - run: pip install -r apps/api/requirements-dev.txt
      - run: python -m pytest
        working-directory: apps/api

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r apps/api/requirements.txt
      - run: npm --prefix apps/web ci
      # regenerate the API types and fail if they differ from what's committed (frontend and backend contracts in sync)
      - run: python -m venv .venv && .venv/bin/pip install -q -r apps/api/requirements.txt && npm --prefix apps/web run types
      - run: git diff --exit-code packages/shared-types/src/api.d.ts
      - run: npm --prefix apps/web run typecheck
      - run: npm --prefix apps/web run build
